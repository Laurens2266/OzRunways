<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <h1 id="page-title">Loading...</h1>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        background: #f5f5f5;
      }
      h1 {
        font-size: 2em;
        text-align: center;
      }
      .item {
        position: relative;
        padding: 20px;
        margin: 10px 0;
        background: white;
        border: 2px solid #ccc;
        border-radius: 10px;
        cursor: pointer;
        user-select: none;
      }
      .item.done {
        background: #c8f7c5;
        border-color: #4caf50;
      }
      .item-title {
        font-size: 1.6em;
        font-weight: bold;
      }
      .item-desc {
        font-size: 1em;
        color: #555;
        margin-top: 5px;
      }
      .item-tick {
        position: absolute;
        top: 50%;
        right: 20px;
        transform: translateY(-50%);
        font-size: 2em;
        color: #4caf50;
        display: none;
      }
      .item.done .item-tick {
        display: block;
      }
      .reset-button {
        margin-top: 30px;
        padding: 20px;
        width: 100%;
        font-size: 1.5em;
        background-color: #ff5252;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
      .reset-button:active {
        background-color: #e53935;
      }
      #checklist-links {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
      }
      #checklist-links a {
        text-decoration: none;
        padding: 10px 20px;
        background-color: #674ea7;
        color: white;
        border-radius: 6px;
        font-size: 1.2em;
      }
      #checklist-links a:active {
        background-color: #1976d2;
      }
      .group-header {
        font-size: 1.3em;
        font-weight: bold;
        margin-top: 20px;
        margin-bottom: 10px;
        padding-left: 5px;
        color: #333;
        border-left: 4px solid #2196f3;
      }
      .toc {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
        padding: 10px;
        background: #f0f0f0;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      .toc-link {
        font-size: 1em;
        text-decoration: none;
        padding: 8px 12px;
        background: #2196f3;
        color: white;
        border-radius: 5px;
      }
      .toc-link:active {
        background: #1976d2;
      }
    </style>
  </head>
  <body>
    <div id="checklist-links">
      <a href="01 - Start and Taxi.html">01 Start & Taxi</a>
      <a href="02 - Runup.html">02 Runup</a>
      <a href="03 - Air.html">03 Air</a>
      <a href="04 - After Landing.html">04 After Landing</a>
      <a href="05 - Emergency.html">05 Emergency</a>
    </div>
    <div id="toc" class="toc"></div>
    <div id="checklist"></div>
    <button class="reset-button" onclick="resetChecklist()">Reset</button>

    <script>
      const checklistData = [
        {
          group: "After Takeoff",
          items: [
            {
              title: "Fuel Pump",
              desc: "OFF & CHECK FUEL PRESSURE (500 ft AGL or above)",
            },
            { title: "Lights – LDG", desc: "OFF" },
          ],
        },
        {
          group: "Approach",
          items: [
            { title: "Height", desc: "1500 ft" },
            { title: "ATIS", desc: "120.90" },
            { title: "Radio", desc: "TWR E 118.10 / TWR W 123.0" },
            { title: "Transponder", desc: "3000" },
            { title: "Set heading", desc: "Runway heading" },
            {
              title: "Descent Circuit Alt",
              desc: "Descent 1000 before arriving at 3 NM radius",
            },
          ],
        },
        {
          group: "Pre-Landing",
          items: [
            { title: "Brakes", desc: "CHECK PRESSURE & OFF" },
            { title: "Undercarriage", desc: "FIXED" },
            { title: "Mixture", desc: "RICH" },
            { title: "Fuel Pump", desc: "ON" },
            { title: "Fuel Selector", desc: "FULLEST TANK" },
            { title: "Oil Temp & Press", desc: "CHECK IN GREEN RANGE" },
            { title: "Hatches & Harnesses", desc: "CHECK SHUT & SECURE" },
          ],
        },
      ];
    </script>

    <script>
      const filePath = window.location.pathname;
      const fileName = filePath.substring(filePath.lastIndexOf("/") + 1);
      const baseName = fileName.replace(".html", "").replace(/[-_]/g, " ");
      const storageKey = `${fileName}_checklistState`;

      document.getElementById("page-title").textContent = decodeURIComponent(
        baseName.charAt(0).toUpperCase() + baseName.slice(1),
      );

      const checklistEl = document.getElementById("checklist");
      const tocEl = document.getElementById("toc");
      const state = new Set(
        JSON.parse(localStorage.getItem(storageKey) || "[]"),
      );
      let globalIndex = 0;

      checklistData.forEach((group) => {
        const id = group.group.toLowerCase().replace(/\s+/g, "-");
        const link = document.createElement("a");
        link.href = `#${id}`;
        link.textContent = group.group;
        link.className = "toc-link";
        tocEl.appendChild(link);

        const groupHeader = document.createElement("div");
        groupHeader.className = "group-header";
        groupHeader.id = id;
        groupHeader.textContent = group.group;
        checklistEl.appendChild(groupHeader);

        group.items.forEach((item) => {
          const div = document.createElement("div");
          div.className = "item";
          if (state.has(globalIndex)) div.classList.add("done");

          const title = document.createElement("div");
          title.className = "item-title";
          title.textContent = item.title;

          const desc = document.createElement("div");
          desc.className = "item-desc";
          desc.textContent = item.desc;

          const tick = document.createElement("div");
          tick.className = "item-tick";
          tick.innerHTML = "✔";

          div.appendChild(title);
          div.appendChild(desc);
          div.appendChild(tick);

          div.addEventListener("click", () => {
            div.classList.toggle("done");
            if (div.classList.contains("done")) {
              state.add(globalIndex);
            } else {
              state.delete(globalIndex);
            }
            localStorage.setItem(storageKey, JSON.stringify([...state]));
          });

          checklistEl.appendChild(div);
          globalIndex++;
        });
      });

      function resetChecklist() {
        localStorage.removeItem(storageKey);
        document
          .querySelectorAll(".item")
          .forEach((el) => el.classList.remove("done"));
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    </script>
  </body>
</html>
